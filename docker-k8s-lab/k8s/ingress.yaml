apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: counter-app-ingress
  namespace: docker-k8s-lab
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: counter-app.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: counter-app-service
            port:
              number: 80
  - host: api.counter-app.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: counter-app-service
            port:
              number: 80

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: counter-app-ingress-traefik
  namespace: docker-k8s-lab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.rule: Host(`counter-app.local`)
spec:
  rules:
  - host: counter-app.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: counter-app-service
            port:
              number: 80